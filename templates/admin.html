<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>betInformativo - Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>⚙️ Gerenciamento</h1>
            <a href="/" style="color: var(--accent-color); text-decoration: none;"><i class="fa-solid fa-arrow-left"></i> Voltar</a>
        </header>

        <div class="painel-grid">
            <div class="card-admin">
                <h3><i class="fa-solid fa-plus"></i> Adicionar / Editar</h3>
                <form action="/admin/salvar" method="POST">
                    <div class="form-group">
                        <label>Posição</label>
                        <input type="number" name="posicao" required min="1">
                    </div>
                    <div class="form-group">
                        <label>Nome do Time</label>
                        <input type="text" name="nome" required>
                    </div>
                    <div class="form-group">
                        <label>Pontos</label>
                        <input type="number" name="pontos" required min="0">
                    </div>
                    <div class="form-group">
                        <label>Forma (V,E,D)</label>
                        <input type="text" name="forma_letras" placeholder="V,V,E,D,V" required>
                    </div>
                    <div class="form-group">
                        <label>Placares</label>
                        <input type="text" name="placares" placeholder="2-1,1-0,0-0,1-1,3-2" required>
                    </div>
                    <button type="submit" class="btn-salvar">Salvar Time</button>
                </form>
            </div>

            <div class="card-admin">
                <h3><i class="fa-solid fa-list"></i> Times no Banco</h3>
                <div class="tabela-container" style="box-shadow: none; border: none;">
                    <table>
                        <thead>
                            <tr>
                                <th>Pos</th>
                                <th>Time</th>
                                <th>Ação</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for time in times %}
                            <tr>
                                <td>{{ time.posicao }}º</td>
                                <td>{{ time.nome }}</td>
                                <td>
                                    <a href="/admin/deletar/{{ time.id }}" style="color: #f75a68; text-decoration: none;" onclick="return confirm('Excluir este time?')">
                                        <i class="fa-solid fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
